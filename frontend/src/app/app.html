<mat-toolbar>
  <a class="brand" routerLink="/">FlowForge</a>
  @if (auth.user()) {
    <nav class="nav">
      <a mat-button routerLink="/dashboard">Dashboard</a>
      <a mat-button routerLink="/projects">Projects</a>
      <a mat-button routerLink="/executions">Executions</a>
    </nav>
  }
  <span class="spacer"></span>
  <span class="backend-status" [attr.data-status]="backendStatus() ?? 'CHECKING'">
    Backend: {{ backendStatus() ?? 'checking…' }}
  </span>
  @if (auth.user(); as user) {
    <span class="user">{{ user.displayName }}</span>
    <button mat-button class="logout" (click)="auth.logout()">Log out</button>
  }
</mat-toolbar>

<main>
  <router-outlet />
</main>
