server:
  port: ${PORT:8080}

spring:
  application:
    name: flowforge

  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]

  # Local development defaults match docker-compose.yml. Override with environment variables elsewhere.
  datasource:
    url: ${FLOWFORGE_DB_URL:jdbc:postgresql://localhost:5432/flowforge}
    username: ${FLOWFORGE_DB_USERNAME:flowforge}
    password: ${FLOWFORGE_DB_PASSWORD:flowforge}
    hikari:
      maximum-pool-size: ${FLOWFORGE_DB_POOL_SIZE:10}

  jpa:
    # Flyway owns the schema. Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    locations: classpath:db/migration

  mail:
    host: ${FLOWFORGE_SMTP_HOST:localhost}
    port: ${FLOWFORGE_SMTP_PORT:1025}
    username: ${FLOWFORGE_SMTP_USERNAME:}
    password: ${FLOWFORGE_SMTP_PASSWORD:}
    properties:
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

  jackson:
    # Unknown JSON fields are rejected (docs/api.md §2), e.g. typos in step configs.
    deserialization:
      fail-on-unknown-properties: true

management:
  health:
    mail:
      enabled: false
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

info:
  app:
    version: ${FLOWFORGE_VERSION:local}

flowforge:
  security:
    jwt:
      secret: ${FLOWFORGE_JWT_SECRET:}
      access-token-ttl: 60m
  worker:
    enabled: true
    instance-id: ${FLOWFORGE_WORKER_INSTANCE_ID:}
    threads: 4
    poll-interval: 1s
    lease-grace: 60s
  recovery:
    enabled: true
    interval: 30s
    batch-size: 50
  scheduler:
    enabled: true
    interval: 15s
    max-runs-per-tick: 100
  mail:
    from: ${FLOWFORGE_MAIL_FROM:flowforge@localhost}
  http:
    allow-private-addresses: ${FLOWFORGE_HTTP_ALLOW_PRIVATE_ADDRESSES:false}
  demo:
    email: ${FLOWFORGE_DEMO_EMAIL:demo@example.com}
    password: ${FLOWFORGE_DEMO_PASSWORD:}
    base-url: ${FLOWFORGE_DEMO_BASE_URL:http://localhost:${server.port}}
