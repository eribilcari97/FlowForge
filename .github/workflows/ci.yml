name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Commits made on Windows may not carry the executable bit.
      - run: chmod +x mvnw

      # Integration tests start PostgreSQL with Testcontainers, using the runner's Docker.
      - run: ./mvnw -B verify

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Use the npm version from package.json "packageManager", not the one bundled with Node.
      # Different npm versions validate package-lock.json differently.
      - run: npm install -g "$(node -p "require('./package.json').packageManager")"

      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build
