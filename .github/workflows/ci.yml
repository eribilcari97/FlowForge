name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Commits made on Windows may not carry the executable bit.
      - run: chmod +x mvnw

      # Integration tests start PostgreSQL with Testcontainers, using the runner's Docker.
      - run: ./mvnw -B verify

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Use the npm version from package.json "packageManager", not the one bundled with Node.
      # Different npm versions validate package-lock.json differently.
      - run: npm install -g "$(node -p "require('./package.json').packageManager")"

      - run: npm ci
      - run: npm run format:check
      - run: npm test -- --watch=false
      - run: npm run build

  images:
    name: Docker image (${{ matrix.component }})
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/flowforge-${{ matrix.component }}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: FLOWFORGE_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy:
    name: Deploy to Render
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RENDER_BACKEND_URL != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.RENDER_FRONTEND_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      BACKEND_URL: ${{ vars.RENDER_BACKEND_URL }}
      FRONTEND_URL: ${{ vars.RENDER_FRONTEND_URL }}
    steps:
      - name: Deploy the backend image of this commit
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/flowforge-backend:${GITHUB_SHA}"
          curl -fsS -X POST "${DEPLOY_HOOK}&imgURL=$(jq -rn --arg v "$image" '$v|@uri')" > /dev/null
          echo "Requested deploy of $image"

      - name: Wait until the backend runs this commit
        run: |
          for _ in $(seq 1 90); do
            version=$(curl -fsS -m 30 "$BACKEND_URL/actuator/info" | jq -r '.app.version' || true)
            if [ "$version" = "$GITHUB_SHA" ]; then
              echo "$BACKEND_URL runs $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done
          echo "$BACKEND_URL did not start running $GITHUB_SHA within 15 minutes"
          exit 1

      - name: Deploy the frontend image of this commit
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/flowforge-frontend:${GITHUB_SHA}"
          curl -fsS -X POST "${DEPLOY_HOOK}&imgURL=$(jq -rn --arg v "$image" '$v|@uri')" > /dev/null
          echo "Requested deploy of $image"

      - name: Smoke test through the frontend
        run: |
          sleep 60
          for _ in $(seq 1 60); do
            if curl -fsS -m 30 "$FRONTEND_URL/" > /dev/null \
              && curl -fsS -m 30 "$FRONTEND_URL/actuator/health" | grep -q '"status":"UP"'; then
              echo "$FRONTEND_URL serves the app and reaches the backend"
              exit 0
            fi
            sleep 10
          done
          echo "$FRONTEND_URL did not pass the smoke test"
          exit 1
